<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>JARVIS AR</title>

    <link rel="stylesheet" href="./style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <video
        id="camera"
        autoplay
        playsinline
        muted
    ></video>

    <canvas id="arCanvas"></canvas>

    <div id="hud">

        <div class="top-bar">

            <div class="brand">
                <div class="brand-dot"></div>
                JARVIS
            </div>

            <div id="connectionStatus" class="status offline">
                OFFLINE
            </div>

        </div>

        <div id="gesturePanel" class="panel">
            <div class="panel-title">VISION</div>

            <div>
                HAND:
                <span id="handValue">NONE</span>
            </div>

            <div>
                GESTURE:
                <span id="gestureValue">NONE</span>
            </div>

            <div>
                TARGET:
                <span id="targetValue">NONE</span>
            </div>

            <div>
                OBJECT:
                <span id="selectedValue">NONE</span>
            </div>
        </div>

        <div id="commandPanel" class="command-panel">

            <div id="commandText">
                Point at an object
            </div>

        </div>

        <div id="keyboard" class="keyboard hidden">

            <div class="keyboard-display">
                <span id="typedText"></span>
                <span class="cursor"></span>
            </div>

            <div class="keyboard-row">
                <button data-key="Q">Q</button>
                <button data-key="W">W</button>
                <button data-key="E">E</button>
                <button data-key="R">R</button>
                <button data-key="T">T</button>
                <button data-key="Y">Y</button>
                <button data-key="U">U</button>
                <button data-key="I">I</button>
                <button data-key="O">O</button>
                <button data-key="P">P</button>
            </div>

            <div class="keyboard-row">
                <button data-key="A">A</button>
                <button data-key="S">S</button>
                <button data-key="D">D</button>
                <button data-key="F">F</button>
                <button data-key="G">G</button>
                <button data-key="H">H</button>
                <button data-key="J">J</button>
                <button data-key="K">K</button>
                <button data-key="L">L</button>
            </div>

            <div class="keyboard-row">
                <button data-key="Z">Z</button>
                <button data-key="X">X</button>
                <button data-key="C">C</button>
                <button data-key="V">V</button>
                <button data-key="B">B</button>
                <button data-key="N">N</button>
                <button data-key="M">M</button>
            </div>

            <div class="keyboard-row special-row">
                <button data-key="BACKSPACE">⌫</button>
                <button data-key="SPACE">SPACE</button>
                <button data-key="ENTER">ENTER</button>
            </div>

        </div>

        <div id="help">
            POINT • PINCH SELECT • DRAG • TWO HANDS SCALE/ROTATE
        </div>

    </div>

    <script type="module" src="./app.js"></script>

</body>
</html>
